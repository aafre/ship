schema_version: "1.0"
name: 01-small-fix-no-fanout
description: >
  A one-line off-by-one in a single file. ship should classify this SMALL and collapse to
  inspect -> edit -> targeted check: fix it, run the nearest test, report. Spawning
  subagents here is the over-orchestration failure the skill exists to prevent.
tags: [core, small]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    page_slice() in pkg/pagination.py drops the last item of every page. Fix it.
  allowed_tools: [Skill, Read, Grep, Glob, Edit, Write, Bash, Agent]
  max_turns: 20
  timeout_seconds: 420
runs: 3
graders:
  - type: regex
    name: off-by-one-removed
    target: { source: file, path: pkg/pagination.py }
    pattern: 'start \+ size\s*-\s*1'
    match: not_contains
    weight: 2
  - type: tool_used
    name: ran-the-nearest-test
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"]*?(?:&&|\|\||;)\s*)?(?:[\w.\-]+\s+run\s+)*(?:python3?\s+-m\s+)?pytest(?:\s|")'
    min: 1
  - type: tool_used
    name: no-subagent-fanout
    tool: Agent
    min: 0
    max: 0
    arm: both
    weight: 2
  - type: llm
    name: report-is-evidence-backed
    focus: last_message
    criteria: |
      Score PASS only if ALL of these hold about the final message:
      1. It states what was changed and where (the slice expression in pkg/pagination.py).
      2. Every claim that a check passed names the concrete command behind it and its
         result. A bare "tests pass" with no command named is a FAIL.
      3. It is short: no plan document, no dependency graph, no multi-phase orchestration
         narrative for what is a one-line fix.
      Judge only what this message says and whether it is internally consistent. Do not
      speculate about what happened outside it.
  - type: tool_used
    name: skill-fired
    tool: Skill
expected_outcome: >
  The slice becomes items[start:start + size], the nearest test file is run and passes, and
  the report is one short paragraph naming the change and the command that proved it.
