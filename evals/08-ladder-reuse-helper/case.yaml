schema_version: "1.0"
name: 08-ladder-reuse-helper
description: >
  pkg/text_utils.py already has a well-tested slugify() helper. The task asks for URL slug
  generation somewhere else in the codebase. The coding-ladder rung "already in this codebase?
  reuse it" should win: import and call the existing helper, not reimplement slug logic.
tags: [core, coding-ladder]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a function to pkg/articles.py that turns an article title into a URL slug for its
    permalink, e.g. make_permalink("Hello, World!") -> "hello-world".
  allowed_tools: [Skill, Read, Grep, Glob, Edit, Write, Bash, Agent]
  max_turns: 20
  timeout_seconds: 420
runs: 3
graders:
  - type: regex
    name: reuses-existing-slugify
    target: { source: file, path: pkg/articles.py }
    pattern: 'slugify'
    match: contains
    weight: 2
  - type: regex
    name: does-not-reimplement-slug-logic
    target: { source: file, path: pkg/articles.py }
    pattern: 're\.sub\('
    match: not_contains
    weight: 2
  - type: tool_used
    name: no-subagent-fanout
    tool: Agent
    min: 0
    max: 0
    arm: both
  - type: llm
    name: report-names-the-reuse
    focus: last_message
    criteria: |
      Score PASS only if the final message says it reused the existing slugify() helper
      (or equivalent language making clear no new slug logic was written from scratch).
      A report that only describes the new function without mentioning reuse is a FAIL.
expected_outcome: >
  pkg/articles.py gains make_permalink() (or similarly named function) that calls
  text_utils.slugify() instead of duplicating the regex-based slug logic.
